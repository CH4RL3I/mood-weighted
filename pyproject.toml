[project]
name = "sentport"
version = "0.1.0"
description = "News sentiment as Black-Litterman views, tested out of sample against honest baselines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa", email = "emiliogappa@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "transformers>=4.40",
    "torch>=2.2",
    "huggingface_hub>=0.23",
]

[project.scripts]
sentport = "sentport.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
